[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dao-replication"
version = "0.1.0"
description = "Independent re-analysis of the released data for Sharma et al. (2026), Sci. Rep. 16:11792"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
digitize = ["pillow>=10", "pymupdf>=1.24"]
text = ["scikit-learn>=1.4", "spacy>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
